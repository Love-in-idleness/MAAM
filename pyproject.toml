[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maam-interest"
version = "0.1.0"
description = "Auditable mathematical-interest metrics for formal propositions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Idleness"}]
dependencies = []

[project.optional-dependencies]
reproduction = ["numpy==2.3.5", "scipy==1.17.0", "matplotlib==3.10.8"]

[project.scripts]
maam = "maam.cli:main"

[tool.setuptools]
packages = ["maam"]

[tool.setuptools.package-data]
maam = ["Export.lean", "PaperExport.lean", "PackageCheck.lean", "Inventory.lean"]
