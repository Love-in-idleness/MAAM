name: Theory-package reference
on:
  push:
    paths:
      - 'maam/theory.py'
      - 'maam/PackageCheck.lean'
      - 'maam/cli.py'
      - 'experiments/hom_kernel/**'
      - 'scripts/check_theory_package.py'
      - '.github/workflows/theory-package.yml'
  pull_request:
    paths:
      - 'maam/theory.py'
      - 'maam/PackageCheck.lean'
      - 'experiments/hom_kernel/**'
      - 'scripts/check_theory_package.py'
      - '.github/workflows/theory-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Verify both reference proofs and account for the package
        run: |
          mkdir -p data/theory-package
          python -m maam evaluate-package --experiment experiments/hom_kernel/experiment.json --output data/theory-package/theory-package-reference.json
      - name: Check actual Lean rejection cases
        run: python scripts/check_theory_package.py --report data/theory-package/theory-package-reference.json --negative-output data/theory-package/theory-package-negative.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theory-package-reference
          path: |
            data/theory-package/theory-package-reference.json
            data/theory-package/theory-package-negative.json
          retention-days: 30
          if-no-files-found: error
