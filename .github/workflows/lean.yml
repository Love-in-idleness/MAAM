name: Lean adapter
# Check the pinned Lean toolchain when the adapter or its fixtures change.
on:
  push:
    paths:
      - 'maam/**'
      - 'lean/**'
      - 'scripts/check_lean_smoke.py'
      - 'scripts/build_paper_exporter.sh'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'maam/**'
      - 'lean/**'
      - 'scripts/check_lean_smoke.py'
      - 'scripts/build_paper_exporter.sh'
      - '.github/workflows/lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build small propositions
        working-directory: lean
        run: lean -o Demo.olean Demo.lean
      - name: Export and evaluate
        run: |
          python -m maam export-lean --runner lean --project lean --module Demo --target Demo.andRight --target Demo.modusPonens --target Demo.andSwap --target Demo.admittedExample --output results/lean-demo.json
          python -m maam rank --corpus results/lean-demo.json --format text
          python scripts/check_lean_smoke.py results/lean-demo.json
      - name: Compare native and interpreted streaming exports
        run: |
          bash scripts/build_paper_exporter.sh
          mkdir -p data
          LEAN_PATH=lean lean --run maam/PaperExport.lean Demo Demo lean data/interpreted.jsonl smoke
          LEAN_SYSROOT="$(lean --print-prefix)" LEAN_PATH=lean build/maam-paper-export Demo Demo lean data/native.jsonl smoke
          python scripts/check_paper_smoke.py data/native.jsonl
          python - <<'PY'
          import json
          def read(path):
              with open(path) as stream:
                  return {r.get('name', '@metadata'): r for line in stream if (r := json.loads(line))}
          assert read('data/native.jsonl') == read('data/interpreted.jsonl'), 'native export changed measurements'
          print('Native and interpreted exports agree, including source ranges and multiplicities.')
          PY
