name: Metered generation controls
on:
  push:
    paths:
      - 'maam/**'
      - 'scripts/control_generation.py'
      - 'scripts/check_generation.py'
      - 'scripts/control_transfer.py'
      - 'scripts/check_transfer.py'
      - 'scripts/check_transfer_tasks.py'
      - 'scripts/summarize_transfer.py'
      - 'scripts/summarize_formal_transfer.py'
      - 'tests/test_generation.py'
      - 'tests/test_transfer*.py'
      - 'tests/test_formal_transfer_summary.py'
      - 'tests/test_deepseek.py'
      - 'experiments/hom_kernel_migration/**'
      - 'experiments/metered_transfer_v1/**'
      - '.github/workflows/generation.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline accounting and failure controls
        run: python -m unittest discover -s tests -p test_generation.py -v
      - name: Offline transfer protocol and DeepSeek boundaries
        run: |
          python -m unittest discover -s tests -p 'test_transfer*.py' -v
          python -m unittest discover -s tests -p test_formal_transfer_summary.py -v
          python -m unittest discover -s tests -p test_deepseek.py -v
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Deterministic transport with actual Lean checks
        run: python scripts/check_generation.py --output data/generation-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-smoke
          path: data/generation-smoke
