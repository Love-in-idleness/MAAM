name: Complete proof portfolios
on:
  push:
    paths:
      - 'maam/precompression.py'
      - 'maam/attribution.py'
      - 'maam/migration.py'
      - 'maam/PackageCheck.lean'
      - 'scripts/check_precompression.py'
      - 'experiments/precompression_v1/**'
      - '.github/workflows/precompression.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Check original goals and complete source accounting
        env:
          ELAN_TOOLCHAIN: leanprover/lean4:v4.33.1
        run: |
          python -m unittest discover -s tests -p test_precompression.py -v
          python scripts/check_precompression.py --workdir "$RUNNER_TEMP/precompression-lean" --output "$RUNNER_TEMP/precompression-checked.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precompression-calibration
          path: |
            ${{ runner.temp }}/precompression-checked.json
            ${{ runner.temp }}/precompression-lean/
