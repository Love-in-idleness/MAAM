name: Grouped proof search
on:
  push:
    paths:
      - 'maam/grouped_search.py'
      - 'maam/grouped_methods.py'
      - 'maam/migration.py'
      - 'maam/precompression.py'
      - 'maam/PackageCheck.lean'
      - 'experiments/grouped_search_v1/**'
      - 'scripts/check_grouped_search.py'
      - '.github/workflows/grouped-search.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check grouped protocol and finite method execution
        env:
          ELAN_TOOLCHAIN: leanprover/lean4:v4.33.1
        run: |
          python -m unittest discover -s tests -p test_grouped_search.py -v
          python scripts/check_grouped_search.py --workdir "$RUNNER_TEMP/group-calibration" --output "$RUNNER_TEMP/group-calibration.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grouped-proof-search
          path: |
            ${{ runner.temp }}/group-calibration.json
            ${{ runner.temp }}/group-calibration/
