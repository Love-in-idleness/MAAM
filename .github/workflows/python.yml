name: Python calculator
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Reproduce committed reports within numerical tolerance
        run: python scripts/verify_results.py
      - name: Measure and replay complete compressed reference packages
        run: |
          python scripts/measure_compressed_reference.py --output "$RUNNER_TEMP/compressed-reference.json"
          python scripts/measure_compressed_reference.py --check "$RUNNER_TEMP/compressed-reference.json"
      - name: Verify installable package
        run: |
          python -m pip install .
          maam --version
